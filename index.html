<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>睡眠打卡趨勢圖</title>
<style>
  :root {
    color-scheme: light dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #FBF9F5;
    --card-bg: #FFFFFF;
    --text: #453F4D;
    --text-muted: #9992A3;
    --border: #EFE9F2;
    --mint: #C8E6D8;
    --mint-text: #2E6B4F;
    --peach: #FBDCD1;
    --peach-text: #A8503A;
    --accent: #B8A6D9;
    --holo-1: #B9C3EA;
    --holo-2: #D6BEE0;
    --holo-3: #F0BFD2;
    --holo-4: #F8CBAE;
    --holo-wash: linear-gradient(135deg, #EEF0FA 0%, #F6EEF6 35%, #FBEDF1 65%, #FCF1E8 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #201C18;
      --card-bg: #2B2620;
      --text: #EDE6DB;
      --text-muted: #948A7C;
      --border: #3A342C;
      --mint: #1F3B30;
      --mint-text: #8FD9B6;
      --peach: #3D2A24;
      --peach-text: #F0A98F;
      --accent: #9683C4;
      --holo-1: #6B74B8;
      --holo-2: #8A69A0;
      --holo-3: #B8637E;
      --holo-4: #C07F52;
      --holo-wash: linear-gradient(135deg, #211F2E 0%, #251E29 35%, #281D22 65%, #241C18 100%);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-block: 20px;
    padding-inline: 16px;
    background: var(--holo-wash), var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    font-size: 14px;
  }
  [hidden] { display: none !important; }
  .ribbon {
    height: 6px;
    max-width: 200px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--holo-1), var(--holo-2), var(--holo-3), var(--holo-4));
    margin: 0 0 14px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    font-weight: 800;
    background: linear-gradient(90deg, var(--holo-1), var(--holo-2) 35%, var(--holo-3) 65%, var(--holo-4));
    -webkit-background-clip: text;
    background-clip: text;
    color: var(--text);
    -webkit-text-fill-color: transparent;
  }
  h2 { font-size: 14px; color: var(--text-muted); margin: 0 0 10px; font-weight: 600; }
  .updated-at { font-size: 12px; color: var(--text-muted); margin: 0 0 16px; }
  .wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 1px 2px rgba(69,63,77,0.05), 0 6px 20px rgba(69,63,77,0.05);
  }
  .card--hero { position: relative; overflow: hidden; }
  .card--hero::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--holo-1), var(--holo-2), var(--holo-3), var(--holo-4));
  }
  .stat-value, td { font-variant-numeric: tabular-nums; }
  .overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
  }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat-label { font-size: 12px; color: var(--text-muted); }
  .stat-value { font-size: 20px; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; white-space: nowrap; }
  .badge-mint { background: var(--mint); color: var(--mint-text); }
  .badge-peach { background: var(--peach); color: var(--peach-text); }
  .empty { color: var(--text-muted); font-size: 13px; padding: 24px 0; text-align: center; }
  .table-scroll { overflow-x: auto; }
  svg text { fill: var(--text-muted); font-size: 10px; }
  .chart-line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .chart-dot { fill: var(--accent); }
  .chart-dot-invalid { fill: var(--peach-text); }
  .chart-grid { stroke: var(--border); stroke-width: 1; }
  .chart-target { stroke: var(--mint-text); stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ribbon"></div>
  <h1>睡眠打卡趨勢圖</h1>
  <div class="updated-at">資料更新時間:2026-09-16 22:23(本地資料,重新執行 generate_sleep_dashboard.py 可刷新)</div>

  <div class="card card--hero">
    <h2>總覽</h2>
    <div class="overview-grid"><div class="empty">尚無資料</div></div>
  </div>

  <div class="card">
    <h2>每日睡眠時長趨勢</h2>
    <div class="empty">尚無資料</div>
  </div>

  <div class="card">
    <h2>打卡明細</h2>
    <div class="table-scroll"><div class="empty">尚無資料</div></div>
  </div>
</div>
</body>
</html>
